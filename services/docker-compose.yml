# Local Postgres for @mpb/services.
#   docker compose up -d postgres
# DATABASE_URL=postgres://mpb:mpb@127.0.0.1:54329/mpb
# The test suite uses a separate database (mpb_test) on the same server; it is
# created automatically by the init script below.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mpb-postgres
    environment:
      POSTGRES_USER: mpb
      POSTGRES_PASSWORD: mpb
      POSTGRES_DB: mpb
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - mpb-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpb -d mpb"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  mpb-pgdata:
